name: AEONFALL Validation

on:
  push:
    paths:
      - "content/catalog/**"
      - "content/crafting/**"
      - "content/vertical_slice/**"
      - "content/world/**"
      - "content/transcendent/**"
      - "content/implementation/**"
      - "content/sovereign/**"
      - "content/runtime/**"
      - "verse/**"
      - "verse/generated/**"
      - "schemas/**"
      - "tools/validate_catalog.py"
      - "tools/validate_crafting.py"
      - "tools/build_status.py"
      - "tools/build_content_index.py"
      - "tools/quality_audit.py"
      - "tools/validate_quotas.py"
      - "tools/validate_vertical_slice.py"
      - "tools/validate_uefn_bindings.py"
      - "tools/validate_world_topology.py"
      - "tools/validate_region_001_living_world.py"
      - "tools/validate_region_001_faction_conflicts.py"
      - "tools/build_region_001_faction_conflict_registry.py"
      - "tools/build_region_001_living_world_registry.py"
      - "tools/validate_slice_recipes.py"
      - "tools/validate_slice_encounters.py"
      - "tools/validate_slice_rewards.py"
      - "tools/build_slice_reward_registry.py"
      - "tools/validate_slice_shop.py"
      - "tools/validate_slice_combat.py"
      - "tools/validate_slice_adapters.py"
      - "tools/validate_slice_delivery.py"
      - "tools/build_slice_combat_registry.py"
      - "tools/build_slice_class_registry.py"
      - "tools/validate_slice_taming.py"
      - "tools/build_slice_taming_registry.py"
      - "tools/validate_slice_hireables.py"
      - "tools/build_slice_hireable_registry.py"
      - "tools/validate_slice_classes.py"
      - "tools/build_slice_registry.py"
      - "tools/build_world_registry.py"
      - "tools/build_slice_recipe_registry.py"
      - "tools/build_slice_shop_registry.py"
      - "tools/validate_verse_static.py"
      - "tools/validate_runtime_invariants.py"
      - "tools/validate_implementation_evidence.py"
      - "tools/build_transcendent_authority_registry.py"
      - "tools/validate_transcendent_authorities.py"
      - "tools/build_ascended_form_registry.py"
      - "tools/validate_ascended_forms.py"
      - "tools/validate_ascended_form_adapter_bindings.py"
      - "tools/validate_transformation_launch_tests.py"
      - "tools/validate_transcendent_adapter_bindings.py"
      - "tools/validate_launch_test_plan.py"
      - "tools/**"
      - "tests/**"
      - "assets/source/ossuary_starter/**"
      - "bootstrap/**"
      - "STATUS.md"
      - ".github/workflows/catalog-validation.yml"
  pull_request:
    paths:
      - "content/catalog/**"
      - "content/crafting/**"
      - "content/vertical_slice/**"
      - "content/world/**"
      - "content/transcendent/**"
      - "content/implementation/**"
      - "content/sovereign/**"
      - "content/runtime/**"
      - "verse/**"
      - "verse/generated/**"
      - "schemas/**"
      - "tools/validate_*.py"
      - "tools/build_*.py"
      - "tools/**"
      - "tests/**"
      - "assets/source/ossuary_starter/**"
      - "bootstrap/**"
      - "STATUS.md"
      - ".github/workflows/catalog-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate AEONFALL catalog
        run: python tools/validate_catalog.py

      - name: Validate Axiom Heart crafting graph
        run: python tools/validate_crafting.py

      - name: Audit content diversity
        run: python tools/quality_audit.py

      - name: Enforce original family minimums
        run: python tools/validate_quotas.py

      - name: Validate first production vertical slice
        run: python tools/validate_vertical_slice.py

      - name: Validate UEFN binding matrix
        run: python tools/validate_uefn_bindings.py

      - name: Validate streamed world topology
        run: python tools/validate_world_topology.py

      - name: Validate Ossuary March living world
        run: python tools/validate_region_001_living_world.py

      - name: Validate Ossuary March faction conflicts
        run: python tools/validate_region_001_faction_conflicts.py

      - name: Build Ossuary March faction-conflict Verse registry
        run: python tools/build_region_001_faction_conflict_registry.py

      - name: Check generated Ossuary March faction-conflict bootstrap
        run: git diff --exit-code -- verse/generated/region_001_faction_conflict_bootstrap.verse

      - name: Build Ossuary March living-world Verse registry
        run: python tools/build_region_001_living_world_registry.py

      - name: Check generated Ossuary March living-world bootstrap
        run: git diff --exit-code -- verse/generated/region_001_living_world_bootstrap.verse

      - name: Validate vertical slice recipes
        run: python tools/validate_slice_recipes.py

      - name: Build first-slice recipe Verse registry
        run: python tools/build_slice_recipe_registry.py

      - name: Check generated first-slice recipe bootstrap
        run: git diff --exit-code -- verse/generated/slice_001_recipe_bootstrap.verse

      - name: Validate vertical slice encounters
        run: python tools/validate_slice_encounters.py

      - name: Validate first-slice encounter rewards
        run: python tools/validate_slice_rewards.py

      - name: Build first-slice encounter reward registry
        run: python tools/build_slice_reward_registry.py

      - name: Check generated first-slice reward bootstrap
        run: git diff --exit-code -- verse/generated/slice_001_reward_bootstrap.verse

      - name: Validate first-slice shop economy
        run: python tools/validate_slice_shop.py

      - name: Build first-slice shop Verse registry
        run: python tools/build_slice_shop_registry.py

      - name: Check generated first-slice shop bootstrap
        run: git diff --exit-code -- verse/generated/slice_001_shop_bootstrap.verse

      - name: Validate first-slice combat runtime data
        run: python tools/validate_slice_combat.py

      - name: Validate first-slice adapter coverage
        run: python tools/validate_slice_adapters.py

      - name: Validate first-slice physical delivery coverage
        run: python tools/validate_slice_delivery.py

      - name: Validate first-slice class runtime data
        run: python tools/validate_slice_classes.py

      - name: Validate Verse static safety
        run: python tools/validate_verse_static.py

      - name: Validate AEONFALL runtime invariants
        run: python tools/validate_runtime_invariants.py
      - name: Validate horde runtime integration
        run: python tools/validate_horde_runtime.py

      - name: Validate typed event queues and activation transactions
        run: |
          python tools/validate_runtime_event_bus.py
          python tools/test_runtime_event_bus_validation.py
          python tools/validate_activation_transactions.py
          python tools/test_activation_transaction_validation.py

      - name: Validate canonical encounter directors
        run: |
          python tools/validate_encounter_directors.py
          python tools/test_encounter_director_policy.py
          python tools/build_slice_encounter_directors.py
          git diff --exit-code -- verse/bosses/slice_001_encounter_directors.verse

      - name: Validate actual Ossuary starter geometry
        run: |
          python tools/validate_ossuary_starter_assets.py
          python tools/test_ossuary_starter_assets.py
          python tools/build_ossuary_starter_assets.py
          git diff --exit-code -- assets/source/ossuary_starter

      - name: Test UEFN source installer and editor call contracts
        run: python -m unittest discover -s tests -v


      - name: Validate first playable loop source guards
        run: python tools/validate_first_playable_loop.py

      - name: Validate player loadout and unique sovereign integration
        run: |
          python tools/validate_player_loadout.py
          python tools/validate_sovereign_unmaking.py
          python tools/validate_sovereign_appearance.py
          python tools/migrate_session_services.py --check
          python tools/test_session_services.py

      - name: Validate first playable rig and editor MCP contracts
        run: |
          python tools/build_first_playable_rig.py
          git diff --exit-code -- content/vertical_slice/first_playable_rig.json
          python tools/validate_first_playable_rig.py
          python tools/test_first_playable_rig.py
          python tools/test_uefn_mcp_bridge.py

      - name: Validate implementation evidence
        run: python tools/validate_implementation_evidence.py

      - name: Validate God and Absolute forms
        run: python tools/validate_ascended_forms.py

      - name: Validate God and Absolute adapter bindings
        run: python tools/validate_ascended_form_adapter_bindings.py

      - name: Validate transformation Launch Session plan
        run: python tools/validate_transformation_launch_tests.py

      - name: Build God and Absolute Verse registry
        run: python tools/build_ascended_form_registry.py

      - name: Check generated God and Absolute bootstrap
        run: git diff --exit-code -- verse/generated/ascended_form_bootstrap.verse

      - name: Validate Transcendent Zero Authorities
        run: python tools/validate_transcendent_authorities.py

      - name: Validate Transcendent Authority adapter bindings
        run: python tools/validate_transcendent_adapter_bindings.py

      - name: Build Transcendent Authority Verse registry
        run: python tools/build_transcendent_authority_registry.py

      - name: Check generated Transcendent Authority bootstrap
        run: git diff --exit-code -- verse/generated/transcendent_authority_bootstrap.verse

      - name: Validate Slice 001 Launch Session plan
        run: python tools/validate_launch_test_plan.py

      - name: Build first-slice combat Verse registry
        run: python tools/build_slice_combat_registry.py

      - name: Check generated first-slice combat bootstrap
        run: git diff --exit-code -- verse/generated/slice_001_combat_bootstrap.verse

      - name: Build first-slice class Verse registry
        run: python tools/build_slice_class_registry.py

      - name: Check generated first-slice class bootstrap
        run: git diff --exit-code -- verse/generated/slice_001_class_bootstrap.verse

      - name: Validate first-slice taming challenges
        run: python tools/validate_slice_taming.py

      - name: Build first-slice taming Verse registry
        run: python tools/build_slice_taming_registry.py

      - name: Check generated first-slice taming bootstrap
        run: git diff --exit-code -- verse/generated/slice_001_taming_bootstrap.verse

      - name: Validate first-slice hireable contracts
        run: python tools/validate_slice_hireables.py

      - name: Build first-slice hireable Verse registry
        run: python tools/build_slice_hireable_registry.py

      - name: Check generated first-slice hireable bootstrap
        run: git diff --exit-code -- verse/generated/slice_001_hireable_bootstrap.verse

      - name: Build world topology Verse registry
        run: python tools/build_world_registry.py

      - name: Check generated world topology bootstrap
        run: git diff --exit-code -- verse/generated/world_topology_bootstrap.verse

      - name: Build runtime content index
        run: python tools/build_content_index.py

      - name: Build first-slice Verse registry
        run: python tools/build_slice_registry.py

      - name: Report generated status drift
        run: |
          python tools/build_status.py
          git diff -- STATUS.md || true

  source-package:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package and verify committed source
        run: |
          python tools/build_source_bundle.py \
            --output dist/aeonfall-source.zip \
            --source-checks passed \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload source package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: AEONFALL-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/aeonfall-source.zip
            dist/aeonfall-source.zip.sha256
          if-no-files-found: error
          retention-days: 30
