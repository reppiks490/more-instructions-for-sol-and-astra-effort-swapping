name: AEONFALL Validation

on:
  push:
    paths:
      - "content/catalog/**"
      - "content/crafting/**"
      - "content/vertical_slice/**"
      - "content/world/**"
      - "verse/generated/**"
      - "schemas/**"
      - "tools/validate_catalog.py"
      - "tools/validate_crafting.py"
      - "tools/build_status.py"
      - "tools/build_content_index.py"
      - "tools/quality_audit.py"
      - "tools/validate_quotas.py"
      - "tools/validate_vertical_slice.py"
      - "tools/validate_uefn_bindings.py"
      - "tools/validate_world_topology.py"
      - "tools/validate_slice_recipes.py"
      - "tools/validate_slice_encounters.py"
      - "tools/validate_slice_shop.py"
      - "tools/validate_slice_combat.py"
      - "tools/build_slice_combat_registry.py"
      - "tools/build_slice_class_registry.py"
      - "tools/validate_slice_taming.py"
      - "tools/build_slice_taming_registry.py"
      - "tools/validate_slice_classes.py"
      - "tools/build_slice_registry.py"
      - "STATUS.md"
      - ".github/workflows/catalog-validation.yml"
  pull_request:
    paths:
      - "content/catalog/**"
      - "content/crafting/**"
      - "content/vertical_slice/**"
      - "content/world/**"
      - "verse/generated/**"
      - "schemas/**"
      - "tools/validate_*.py"
      - "tools/build_*.py"
      - "STATUS.md"
      - ".github/workflows/catalog-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate AEONFALL catalog
        run: python tools/validate_catalog.py

      - name: Validate Axiom Heart crafting graph
        run: python tools/validate_crafting.py

      - name: Audit content diversity
        run: python tools/quality_audit.py

      - name: Enforce original family minimums
        run: python tools/validate_quotas.py

      - name: Validate first production vertical slice
        run: python tools/validate_vertical_slice.py

      - name: Validate UEFN binding matrix
        run: python tools/validate_uefn_bindings.py

      - name: Validate streamed world topology
        run: python tools/validate_world_topology.py

      - name: Validate vertical slice recipes
        run: python tools/validate_slice_recipes.py

      - name: Validate vertical slice encounters
        run: python tools/validate_slice_encounters.py

      - name: Validate first-slice shop economy
        run: python tools/validate_slice_shop.py

      - name: Validate first-slice combat runtime data
        run: python tools/validate_slice_combat.py

      - name: Validate first-slice class runtime data
        run: python tools/validate_slice_classes.py

      - name: Build first-slice combat Verse registry
        run: python tools/build_slice_combat_registry.py

      - name: Check generated first-slice combat bootstrap
        run: git diff --exit-code -- verse/generated/slice_001_combat_bootstrap.verse

      - name: Build first-slice class Verse registry
        run: python tools/build_slice_class_registry.py

      - name: Check generated first-slice class bootstrap
        run: git diff --exit-code -- verse/generated/slice_001_class_bootstrap.verse

      - name: Validate first-slice taming challenges
        run: python tools/validate_slice_taming.py

      - name: Build first-slice taming Verse registry
        run: python tools/build_slice_taming_registry.py

      - name: Check generated first-slice taming bootstrap
        run: git diff --exit-code -- verse/generated/slice_001_taming_bootstrap.verse

      - name: Build runtime content index
        run: python tools/build_content_index.py

      - name: Build first-slice Verse registry
        run: python tools/build_slice_registry.py

      - name: Report generated status drift
        run: |
          python tools/build_status.py
          git diff -- STATUS.md || true
