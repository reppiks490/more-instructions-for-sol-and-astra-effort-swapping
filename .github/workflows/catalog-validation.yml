name: AEONFALL Catalog Validation

on:
  push:
    paths:
      - "content/catalog/**"
      - "content/schema/**"
      - "tools/validate_catalog.py"
      - ".github/workflows/catalog-validation.yml"
  pull_request:
    paths:
      - "content/catalog/**"
      - "content/schema/**"
      - "tools/validate_catalog.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate AEONFALL catalog
        run: python tools/validate_catalog.py
