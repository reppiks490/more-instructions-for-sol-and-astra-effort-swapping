name: AEONFALL Catalog Validation

on:
  push:
    paths:
      - "content/catalog/**"
      - "schemas/**"
      - "tools/validate_catalog.py"
      - ".github/workflows/catalog-validation.yml"
  pull_request:
    paths:
      - "content/catalog/**"
      - "schemas/**"
      - "tools/validate_catalog.py"
      - ".github/workflows/catalog-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate AEONFALL catalog
        run: python tools/validate_catalog.py
