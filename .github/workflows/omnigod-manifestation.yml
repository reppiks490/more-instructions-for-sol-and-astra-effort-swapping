name: AEONFALL Omnigod Source Geometry

on:
  push:
    paths:
      - "tools/build_omnigod_manifestation_assets.py"
      - "tools/validate_omnigod_manifestation_assets.py"
      - "tests/test_omnigod_manifestation_assets.py"
      - "tools/build_ossuary_starter_assets.py"
      - "tools/validate_ossuary_starter_assets.py"
      - ".github/workflows/omnigod-manifestation.yml"
  pull_request:
    paths:
      - "tools/build_omnigod_manifestation_assets.py"
      - "tools/validate_omnigod_manifestation_assets.py"
      - "tests/test_omnigod_manifestation_assets.py"
      - "tools/build_ossuary_starter_assets.py"
      - "tools/validate_ossuary_starter_assets.py"
      - ".github/workflows/omnigod-manifestation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run original geometry and provenance tests
        run: python -m unittest discover -s tests -p "test_omnigod_manifestation_assets.py" -v

      - name: Build deterministic import source pack
        run: python tools/build_omnigod_manifestation_assets.py --output dist/omnigod_manifestation

      - name: Validate exported GLB OBJ and exact asset inventory
        run: python tools/validate_omnigod_manifestation_assets.py --output dist/omnigod_manifestation

      - name: Upload original 3D source geometry (NOT a cooked UEFN project)
        uses: actions/upload-artifact@v4
        with:
          name: AEONFALL-Omnigod-static-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/omnigod_manifestation/
          if-no-files-found: error
          retention-days: 30
