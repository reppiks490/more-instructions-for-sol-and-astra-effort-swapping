name: AEONFALL Omnigod Cinematic Source

on:
  push:
    paths:
      - "tools/build_omnigod_cinematic.py"
      - "tools/validate_omnigod_cinematic.py"
      - "tests/test_omnigod_cinematic.py"
      - "tools/build_omnigod_manifestation_assets.py"
      - "tools/build_ossuary_starter_assets.py"
      - ".github/workflows/omnigod-cinematic-source.yml"
  pull_request:
    paths:
      - "tools/build_omnigod_cinematic.py"
      - "tests/test_omnigod_cinematic.py"
      - "tools/build_omnigod_manifestation_assets.py"
      - "tools/build_ossuary_starter_assets.py"
      - ".github/workflows/omnigod-cinematic-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-motion-and-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate animation and original audio sources
        run: python -m unittest discover -s tests -p "test_omnigod_cinematic.py" -v
      - name: Generate original static source geometry
        run: python tools/build_omnigod_manifestation_assets.py --output dist/omnigod_manifestation
      - name: Generate glTF animations and PCM source audio
        run: python tools/build_omnigod_cinematic.py --source dist/omnigod_manifestation/omnigod_dormant_assembly.glb --output dist/omnigod_cinematics
      - name: Independently validate animated GLB, PCM, cue contracts and hashes
        run: python tools/validate_omnigod_cinematic.py --output dist/omnigod_cinematics
      - name: Validate generated cue inventory and animated GLB
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          import build_omnigod_cinematic as c
          root=Path("dist/omnigod_cinematics")
          manifest=json.loads((root/"cue_sheet.json").read_text())
          assert manifest["native_uefn_import"] == "not_run"
          assert manifest["enabled_for_native_activation"] is False
          assert len(manifest["files"]) == 4
          for item in manifest["files"]:
              path=root/item["path"]
              assert path.stat().st_size == item["bytes"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item["sha256"]
          glb,_=c.read_glb(root/"omnigod_mechanical_motion.glb")
          assert len(glb["animations"]) == 3
          print("PASS: 3 glTF animations, 3 original WAV cues, source-only claims")
          PY
      - name: Upload original DCC preview sources (not native UEFN assets)
        uses: actions/upload-artifact@v4
        with:
          name: AEONFALL-Omnigod-cinematic-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/omnigod_cinematics/
          if-no-files-found: error
          retention-days: 30
