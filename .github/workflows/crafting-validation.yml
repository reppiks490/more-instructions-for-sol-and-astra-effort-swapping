name: AEONFALL Crafting Validation

on:
  push:
    paths:
      - "content/crafting/**"
      - "tools/validate_crafting.py"
      - "tools/build_axiom_refinement_registry.py"
      - "tests/test_axiom_refinement.py"
      - "verse/generated/axiom_refinement_recipes.verse"
      - "verse/crafting/axiom_refinement_service.verse"
      - "verse/crafting/axiom_refinement_button_device.verse"
      - ".github/workflows/crafting-validation.yml"
  pull_request:
    paths:
      - "content/crafting/**"
      - "tools/validate_crafting.py"
      - ".github/workflows/crafting-validation.yml"

permissions:
  contents: read

jobs:
  validate-crafting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Axiom Heart recipe graph
        run: python tools/validate_crafting.py

      - name: Verify generated intermediate refinement recipes
        run: python tools/build_axiom_refinement_registry.py --check

      - name: Test intermediate refinement contracts
        run: python -m unittest tests.test_axiom_refinement -v
